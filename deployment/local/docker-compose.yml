version: '3.8'

services:
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: 'star-pos'
      MYSQL_USER: 'star-pos'
      MYSQL_PASSWORD: 'star-pos'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - mysql-star-pos-db:/var/lib/my

volumes:
  mysql-star-pos-db: